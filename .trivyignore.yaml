# Trivy ignore file — the OPERATIONAL suppression channel.
#
# READ THIS BEFORE EDITING. This file no longer carries the rationale. Every
# entry here MUST have a matching entry in `shipwright_accepted_risks.yaml`,
# which is the human-authored record of WHY a finding is accepted and WHEN it
# gets revisited. This file is only the switch that silences it.
#
# The split is enforced in both directions by the drift gate:
#
#     uv run <shared>/scripts/tools/accepted_risks_cli.py check --project-root .
#
# A suppression here with no register entry is UNRECORDED — the compliance
# dashboard renders it as DRIFT, not as an accepted risk, because being
# suppressed is not the same as being accepted. A register entry with no
# suppression here is STALE.
#
# ENTRIES HAVE TWO DIFFERENT NATURES — do not infer one from the other:
#
#   REAL advisory ids (CVE-* / GHSA-*) are honoured by Trivy — but ONLY because
#   `.github/workflows/security.yml` passes `--ignorefile .trivyignore.yaml`
#   explicitly. Trivy auto-discovers only the FLAT `.trivyignore`; the YAML form
#   is still experimental and its docs require the flag. Without it this file is
#   not read at all. That is not hypothetical: the first version of this header
#   claimed auto-discovery, and the accepted risks stayed OPEN on the Security
#   tab until the flag was added (iterate-2026-07-28-security-trivy-ignorefile).
#   With the flag, `expired_at` is LOAD-BEARING: once the date passes Trivy stops
#   ignoring the finding and the alert returns on its own — the built-in
#   tripwire, so an acceptance cannot rot silently even while the register's own
#   `expire` gate is not yet wired into CI. Drop the flag and you silently lose
#   BOTH the suppression and the tripwire.
#
#   SYNTHETIC ids (the `semgrep:` entry below) match no real advisory and are
#   therefore INERT to Trivy; they exist only so the compliance dashboard can
#   render the acceptance, and their `expired_at` is a dashboard signal rather
#   than a scanner behaviour. Historically this file was the only channel
#   carrying a due date at all, which is why a Semgrep / CI-posture decision
#   ended up filed in a Trivy SCA ignore file. `shipwright_accepted_risks.yaml`
#   supersedes that role; the synthetic entry stays here for now because
#   relocating it means moving SHIPWRIGHT_SEMGREP_ACCEPT_GH_OWNED_ACTION_TAGS out
#   of `.claude/settings.json` and into the workflow — a CI-supply-chain change
#   with its own review posture, deliberately not bundled into this change.
#
# SCOPING NOTE: the two advisory entries are id-level, not `paths`-scoped. Trivy
# is not installed on the authoring machine, so a narrower path match could not
# be verified to actually fire, and a suppression that silently fails to apply is
# the worst outcome for both goals here. The precise occurrence sites are
# recorded in the register's `scope.paths`.

vulnerabilities:
  # Register: shipwright_accepted_risks.yaml → ar-2026-07-28-hono-node-server-serve-static-windows
  # Occurs in server/package-lock.json and bootstrapper/package-lock.json.
  - id: GHSA-frvp-7c67-39w9
    expired_at: 2026-10-28
    statement: >-
      @hono/node-server < 2.0.5 path traversal in serve-static on Windows via an
      encoded backslash (%5C). NOT FIXABLE: @hono/node-ws@1.3.1 (latest)
      peer-requires @hono/node-server ^1.19.11, so the patched 2.0.5 breaks the
      embedded terminal's WebSocket upgrade chain (ADR-067). NOT REACHABLE: the
      advisory's impact is reading static files behind a middleware-guarded
      prefix, and this repo mounts no prefix-scoped middleware — every app.use in
      server/src/index.ts is a wildcard, the static root is the public SPA build
      served in full by design, and ".." escape stays blocked. TRIPWIRE: invalid
      the moment auth middleware or a guarded subtree appears under the static
      root. Full rationale and re-review trigger in shipwright_accepted_risks.yaml.

  # Register: shipwright_accepted_risks.yaml → ar-2026-07-28-react-router-rsc-csrf
  # Occurs in client/package-lock.json.
  - id: GHSA-qwww-vcr4-c8h2
    expired_at: 2027-01-28
    statement: >-
      react-router >= 7.12.0 < 8.3.0 RSC-mode CSRF bypass. NOT APPLICABLE: the
      advisory scopes itself to the unstable RSC APIs, and this client is a Vite
      SPA on RouterProvider with no RSC entry point and no unstable_* API in
      client/src (verified by source scan). No patch exists for the 7.x line —
      "fixed in 8.3.0" is a major migration, so there is nothing to upgrade to
      short of one. Full rationale and re-review trigger in
      shipwright_accepted_risks.yaml.

  # SYNTHETIC id — NOT a CVE/GHSA. Inert to Trivy (matches no real advisory).
  # Register: shipwright_accepted_risks.yaml → ar-2026-07-18-gh-owned-action-mutable-tags
  - id: semgrep:github-actions-mutable-action-tag
    expired_at: 2027-07-18
    statement: >-
      GitHub-owned actions (actions/*, github/*) deliberately use mutable version
      tags. SHA-pinning them is only coherent alongside an updater that keeps the
      pins patched, and this project takes no GitHub-hosted proprietary service
      (portability — adopters must not inherit one). An unmaintained pin rots
      silently, which is worse than the mutable tag; and this vendor already
      executes the entire CI run. THIRD-PARTY actions stay SHA-pinned — that is
      where the real supply-chain risk sits, and the Semgrep tailoring is
      owner-scoped so they remain flagged. Enforced by
      server/src/test/ci-action-pinning-posture.test.ts. See the ADR in
      .shipwright/agent_docs/decision_log.md; reverted PR #285 for the history.
      RE-REVIEW TRIGGER: revisit if an open-source, self-hostable updater makes
      SHA-pinning viable without a hosted dependency. The date above is the
      backstop so the decision cannot rot unnoticed while waiting for that event.
