# Gitleaks configuration for shipwright-webui.
#
# Extends gitleaks' full built-in ruleset (useDefault = true) and adds a
# narrowly-scoped allowlist for confirmed false positives. There is only
# ONE global [allowlist] table in gitleaks' schema, so every entry below
# lives in the same table's `regexes`/`stopwords` arrays.
#
# False positive 1: the built-in `sidekiq-secret` rule matches the shape
# `[a-f0-9]{8}:[a-f0-9]{8}`. A documentation placeholder using the famous
# magic-hex constants `cafebabe` / `deadbeef` (i.e. `cafebabe:deadbeef`)
# matches that shape but is obviously NOT a real credential — it is an
# example token, never a live secret. It surfaced from a transient GitHub
# pull-request merge-ref during CI (the string is present in no tracked
# file on any branch — verified via `git grep` across all refs and a clean
# `git archive` scan). This allowlist keeps the secret gate meaningful for
# every real rule while suppressing this single, self-evident placeholder.
#
# False positive 2 (iterate-2026-08-13-task-description-length-cap): the
# built-in `generic-api-key` rule fires on `.shipwright/triage.jsonl` lines
# 450/452, matching the strings `trg-e2emsngmaykjb2h` / `trg-e2emsnhw2r2hy88`.
# Those are internal triage-item / E2E fixture IDs referenced inside a
# compliance note about an unrelated test-cleanup bug — not credentials.
# Confirmed with Sven (svroch) 2026-08-13. Scoped to the exact matched
# strings only, not the whole file or rule.
#
# False positive 3 (iterate-2026-09-23-codextender-webui-integration): the
# built-in `generic-api-key` rule is likely to fire on `server/src/core/
# launcher-codextender.ts`'s `CODEXTENDER_AUTH_TOKEN_PLACEHOLDER =
# "sk-codextender-local"` (an AUTH_TOKEN-named constant assigned an
# sk-prefixed string literal — the exact shape that rule targets), and on
# its re-import/reuse in `server/src/core/codextender-proxy-probe.ts`'s
# Authorization header. This is NOT a credential: it is the local
# Codextender (LiteLLM) proxy's OWN fixed, hardcoded `general_settings.
# master_key` — a value that proxy's `config.py` sets to this exact string
# and validates ONLY against a proxy instance the operator runs themselves
# on their own machine, never against any real Anthropic/OpenAI account.
# Both files' own doc comments state this. Code-review finding
# (iterate-2026-09-23), fixed pre-emptively before a CI Security Scan run.
title = "shipwright-webui gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Confirmed non-secret false positives: cafebabe:deadbeef placeholder (sidekiq-secret), triage fixture IDs trg-e2emsngmaykjb2h / trg-e2emsnhw2r2hy88 (generic-api-key), and the Codextender local-proxy fixed master-key placeholder sk-codextender-local (generic-api-key)."
regexTarget = "match"
regexes = [
  '''cafebabe:deadbeef''',
  '''trg-e2emsngmaykjb2h''',
  '''trg-e2emsnhw2r2hy88''',
  '''sk-codextender-local''',
]
# Belt-and-suspenders: any finding whose secret contains these known
# non-secret placeholders/fixture IDs is treated as a non-secret regardless
# of which rule matched it.
stopwords = [
  "cafebabe",
  "deadbeef",
  "trg-e2emsngmaykjb2h",
  "trg-e2emsnhw2r2hy88",
  "sk-codextender-local",
]
