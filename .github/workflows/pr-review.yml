name: PR Review Prepare

# Stage 1 of the two-stage Tier-3 PR review. Ported from the shipwright
# monorepo (shipwright#437, iterate-2026-07-27-review-gate-failclosed-fork),
# which replaced the single-stage shape this file used to carry.
#
# This stage runs on EVERY pull request, including one raised from a fork, and
# holds NO credentials. Its jobs do two things: trigger stage 2
# (`pr-review-run.yml`, which fires on this workflow's completion and holds the
# credentials), and record what the contributor proposed.
#
# Why the split: GitHub withholds every repository secret from a
# `pull_request` run raised from a fork, so the reviewer could not run on one
# at all. The previous shape guarded its `decide` job on
# `head.repo.full_name == github.repository`; on a fork PR that job was
# skipped, `review` was skipped through `needs:`, and **GitHub scores a skipped
# job as a SUCCESSFUL required check** — the required `PR Review` context went
# green having reviewed nothing, while every other check still ran and still
# blocked.
#
# NOTHING THIS STAGE PRODUCES IS TRUSTED. `pull_request` runs the workflow file
# from the PR head, so a contributor controls this file and everything it
# emits. The uploaded artifact is an AUDIT RECORD of what stage 1 saw — stage 2
# reads no authorisation, no identity and no diff from it. The tier decision
# and the reviewed diff are derived in stage 2 from the API, in default-branch
# code the contributor cannot edit. An earlier upstream draft put the tier
# decision here and let stage 2 honour it; that allowed a PR to declare itself
# exempt and collect a green status. Do not move policy back into this file.
#
# Required status check: `PR Review` is NOT produced here. It is a commit
# status posted by stage 2. That is deliberate and load-bearing — if stage 2
# never reports, the context is absent, and an absent required context is
# `pending`, which blocks the merge: silence counts as not passing, as a
# mechanism rather than a convention. Nothing in this file may emit a check
# under that name; two producers of one context is the ambiguity GitHub's own
# docs warn against.
#
# NO `merge_group` trigger, and that is a constraint rather than an omission:
# a required context in a merge queue must be reported by a run triggered on
# `merge_group`, and neither `PR Review` nor `Reviewer Selftest` would ever
# report on a queue entry. Entries would sit until they timed out. Fail-closed,
# and irrelevant today (squash-PR-only, no queue) — but the moment a queue is
# enabled, stage 1 needs `merge_group` AND stage 2 needs a different way to
# resolve the change, because a queue ref has no pull request at its head SHA.
#
# `Reviewer Selftest` STAYS here, and is the one job whose name matters
# outside this file: it is offline and credential-free, so it belongs on the
# untrusted side by the same least-privilege logic that puts the reviewer on
# the trusted one, and it is itself a required context that must keep
# reporting on every pull request.

on:
  pull_request:
    branches: [main]
    # `unlabeled` matters as much as `labeled`, and is NOT in the upstream
    # shape: without it, REMOVING the waiver label fires no event, so a waiver
    # granted once could never be revoked — the green status earned under the
    # label would simply stay. Adding a label re-decides; removing one must too.
    #
    # `edited` is deliberately ABSENT, and that is not an oversight. Changing a
    # PR's base fires `edited`, not `synchronize`, so it looks like a bypass —
    # but `branches: [main]` means a PR that targeted something else was never
    # reviewed here and has NO status to inherit. Re-pointing it at main fires
    # nothing we listen to, so the required context stays ABSENT, which blocks.
    # The failure mode is "needs one more push to start the review", not "merges
    # unreviewed". Adding `edited` would re-run the reviewer on every title and
    # description edit to buy that convenience.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Read-only token (OpenSSF Scorecard Token-Permissions). This stage reads an
# attacker-influenced diff and needs nothing beyond reading it. The write
# scopes live in stage 2, which never runs contributor code.
permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Reviewer Selftest
    # Offline, no credentials — runs on every PR (incl. forks) so a broken
    # vendored copy of pr_review.py / a workflow-shape regression fails red in
    # CI. Its failure also reaches the verdict: stage 2 reads this workflow's
    # overall conclusion and posts `PR Review = failure` when it is not success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyYAML is REQUIRED, not optional (iterate-2026-07-29-accepted-risk-ci-gate).
      # scripts/ci/tests now also covers the vendored accepted-risk gate, whose
      # contract tests subprocess the CLI and assert exact exit codes. Without
      # PyYAML every register-parsing path returns 2 (the fail-closed
      # "gate could not run" code) and five of those tests fail — so this job
      # would be RED unconditionally and could no longer distinguish a real
      # vendored-file edit from baseline. A drift guard that is always red is
      # not a drift guard. The two-stage workflow guards parse YAML too.
      - name: Install pytest + PyYAML
        run: pip install pytest pyyaml

      - name: Run vendored reviewer self-tests
        run: python -m pytest scripts/ci/tests -q

  prepare:
    name: Prepare review request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record the change for audit
        # All github context is hoisted into env vars; the run body below never
        # interpolates ${{ github.* }} directly (run-shell-injection guard,
        # semgrep yaml.github-actions.security.run-shell-injection).
        #
        # This is evidence, not input. The API serves the diff at the PR's
        # CURRENT head; this preserves what was proposed at THIS sha, which is
        # what survives a force-push.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p pr-review-request
          git diff "$BASE_SHA" "$HEAD_SHA" > pr-review-request/pr.diff
          jq -n --arg pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr_number: $pr, head_sha: $head, base_sha: $base}' \
            > pr-review-request/meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-request
          path: pr-review-request/
          retention-days: 3
